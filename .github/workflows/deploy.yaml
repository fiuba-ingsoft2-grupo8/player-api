name: Deploy on EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build docker image
        run: docker build -t jandresen99/player-api .
      - name: Push image to docker hub
        run: docker push jandresen99/player-api:latest
  deploy:
    needs: build
    runs-on: [self-hosted, player-api]
    steps:
      - name: Delete old container
        run: sudo docker rm -f player-api
      - name: Cleanup docker
        run: sudo docker system prune -af --volumes
      - name: Pull docker image
        run: sudo docker pull jandresen99/player-api:latest
      - name: Run docker container
        run: |
          sudo docker run -d -p 8080:8080 --name player-api \
            -e APP_ENV="${{ secrets.APP_ENV }}" \
            -e ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -e AUDIO_BUCKET="${{ secrets.AUDIO_BUCKET }}" \
            -e IMAGES_BUCKET="${{ secrets.IMAGES_BUCKET }}" \
            -e SIGNED_URL_TTL="${{ secrets.SIGNED_URL_TTL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            jandresen99/player-api:latest